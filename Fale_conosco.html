<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fale conosco</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
     <header class="cabecalho"><!--Cabeçalho do Site-->
        <div class="logo">📽️ cineSENAI</div> <!--DIV Divisão ou Bloco do site-->
        <nav class="menu"><!--Menu de navegação-->
            <a href="index.html">Em cartaz</a>
            <a href="">Em Breve</a>
            <a href="">Preços</a>
            <a hreflang="">Fale conosco</a>
        </nav>
    </header>

    <main class="container">
        <h1 class="titulo-secao">Cadastro Para Dicas De Filmes</h1>
        <p class="subtitulo">Preencha seus dados para realizar sua inscrição no CineSENAI
        </p>

        <div class="area-inscricao"">

            <form action="/processar-cadastro" method="post" class="coluna-form">
                
                <label for="nome">Nome completo:</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" 
                required minlength="3" maxlength="50"><br>

                <label for="Senha"> Senha de acesso:</label>
                <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required minlength="8" maxlength="15"><br>

                <label for="email"> E-mail:</label>
                <input type="email" id="email" name="email" placeholder="exemplo@dominio.com" required><br>

                <label for="data_nasci">Data de nascimento:</label>
                <input type="date" name="data_nascimento" id="data_nasci" min="1900-01-01" max="2026-12-31" required><br>

                <label>Período dos filmes:</label><br>
                <input type="radio" id="turno_manha" name="turno" value="manha" required>
                <label for="turno_manha">Manhã</label>
                <input type="radio" id="turno_tarde" name="turno" value="tarde" required>
                <label for="turno_tarde">Tarde</label>
                <input type="radio" id="turno_noite" name="turno" value="noite" required>
                <label for="turno_noite">Noite</label><br><br>

                <label>Gêneros de interesse:</label><br>
                <input type="checkbox" id="acao" name="interesse" value="acao">
                <label for="acao">Ação</label><br>
                <input type="checkbox" id="comedia" name="interesse" value="comedia">
                <label for="comedia">Comédia</label><br>
                <input type="checkbox" id="terror" name="interesse" value="terror">
                <label for="terror">Terror</label><br>

                <label for="unidade">Selecione o cinema:</label>
                <select name="unidade" id="unidade" required>
                    <option value="" disa selected>Selecione o cinema</option>
                    <option value="SP">São Paulo - Capital</option>
                    <option value="sebastianopoles">Sebastianópolis Do Sul</option>
                    <option value="Votuporanga">Votuporanga</option>
                    <option value="VG">Valentim Gentil</option>
                </select><br>

                <input type="checkbox" id="termo" name="termos" required>
                <label for="termos">Li e aceito os termos</label><br>
                <button type="submit" class="btn-enviar">Enviar</button>
                <button type="reset" class="btn-limpar">Limpar tudo</button>

            </form>

        <div class="coluna-midia">
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3733.325289857872!2d-49.92364282604478!3d-20.65634091133467!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94bd7b4b248f03a1%3A0xb8ed21a313f879da!2sSebastianopolis%20do%20Sul!5e0!3m2!1spt-BR!2sbr!4v1787665699177!5m2!1spt-BR!2sbr" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin">
            </iframe>
        
        </div>


        </div>



    </main>


</body>
</html>
